<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="cv-gradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <!-- Brand Emerald Rounded Container -->
  <rect width="32" height="32" rx="7" fill="url(#cv-gradient)" />
  <!-- Centered Compass Brand Mark -->
  <g transform="translate(4, 4)">
    <!-- Outer Ring -->
    <circle cx="12" cy="12" r="9.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <!-- Compass Needle (North-East tip crisp white, South-West tip soft mint) -->
    <polygon points="16.24,7.76 14.12,14.12 12,12 9.88,9.88" fill="#ffffff" />
    <polygon points="7.76,16.24 14.12,14.12 12,12 9.88,9.88" fill="#a7f3d0" />
    <polygon points="16.24,7.76 14.12,14.12 7.76,16.24 9.88,9.88" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linejoin="round" />
    <!-- Center Pivot Pin -->
    <circle cx="12" cy="12" r="1.5" fill="#047857" stroke="#ffffff" stroke-width="0.5" />
  </g>
</svg>